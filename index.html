<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>LUNE — Personal Knowledge Base</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Restore path from 404.html redirect query param
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p && p.charAt(0) === '/' && p.charAt(1) !== '/') {
          window.history.replaceState(null, '', p);
        }
      })();
    </script>
    <script>
      // Apply theme before app hydration to avoid visual flicker.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var fromTransition = urlTheme === 'dark' || urlTheme === 'light';
          var theme;
          if (fromTransition) {
            theme = urlTheme;
            localStorage.setItem('theme', theme);
            params.delete('theme');
            var cleanSearch = params.toString();
            history.replaceState(
              null,
              '',
              window.location.pathname + (cleanSearch ? '?' + cleanSearch : '') + window.location.hash
            );
          } else {
            var saved = localStorage.getItem('theme');
            theme =
              saved === 'dark' || saved === 'light'
                ? saved
                : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
          if (fromTransition) {
            window.__siteArrivalTheme = theme;
          }
        } catch (_err) {}
      })();
    </script>
  </head>

  <body>
    <script>
      // Mount cross-site arrival overlay synchronously at start of <body> so document.body exists.
      (function () {
        try {
          var theme = window.__siteArrivalTheme;
          if (theme !== 'dark' && theme !== 'light') return;
          delete window.__siteArrivalTheme;
          var bg = theme === 'dark' ? '#111111' : '#ffffff';
          var dotColor = theme === 'dark' ? '#f5f5f4' : '#0a0a0a';
          var labelColor = theme === 'dark' ? 'rgba(245,245,244,0.6)' : 'rgba(10,10,10,0.5)';
          var overlay = document.createElement('div');
          overlay.id = 'site-arrival-overlay';
          overlay.setAttribute(
            'style',
            'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;' +
              'justify-content:center;background:' + bg + ';pointer-events:all;' +
              'transition:opacity 280ms ease;'
          );
          overlay.innerHTML =
            '<div style="display:flex;flex-direction:column;align-items:center;gap:16px">' +
            '<div style="display:flex;gap:8px">' +
            '<span class="st-dot" style="width:8px;height:8px;border-radius:50%;background:' + dotColor + '"></span>' +
            '<span class="st-dot" style="width:8px;height:8px;border-radius:50%;background:' + dotColor + '"></span>' +
            '<span class="st-dot" style="width:8px;height:8px;border-radius:50%;background:' + dotColor + '"></span>' +
            '</div>' +
            '<p style="color:' + labelColor + ';font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;margin:0">Redirecting\u2026</p>' +
            '</div>' +
            '<style>' +
            '.st-dot{animation:st-dp 1s ease-in-out infinite}' +
            '.st-dot:nth-child(2){animation-delay:.15s}' +
            '.st-dot:nth-child(3){animation-delay:.3s}' +
            '@keyframes st-dp{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}' +
            '</style>';
          document.body.appendChild(overlay);
          window.__siteArrivalOverlay = true;
        } catch (_err) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
